name: cad-converter

services:
  cad-converter:
    build:
      context: .
      dockerfile: Dockerfile
    image: rsanjur/cad-converter:local
    container_name: cad-converter-api
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      DATA_DIR: /data
      CAD_MAX_UPLOAD_BYTES: "90000000"
      CAD_MAX_OUTPUT_BYTES: "90000000"
      CAD_MAX_PDF_PAGES: "40"
    volumes:
      - /opt/mapas/archivos_clientes:/data
    expose:
      - "8090"
    networks:
      - mapas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mapas:
    external: true
    name: rsanjur-mapas_mapas
